<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1080px;overflow:hidden}
body{background:#f6f1e6;
  background-image:linear-gradient(#e6dccb 2px,transparent 2px),linear-gradient(90deg,#e6dccb 2px,transparent 2px);
  background-size:90px 90px;background-position:-1px -1px;display:grid;place-items:center}
.seal{width:600px;height:600px;border-radius:84px;background:#c8372d;color:#fff6ee;
  font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;font-weight:700;font-size:230px;line-height:1;
  display:grid;grid-template-columns:1fr 1fr;place-items:center;padding:40px;box-sizing:border-box;
  transform:rotate(-4deg);box-shadow:0 18px 40px rgba(43,42,40,.18)}
</style></head><body>
<div class="seal"><span>每</span><span>天</span><span>一</span><span>句</span></div>
</body></html>
